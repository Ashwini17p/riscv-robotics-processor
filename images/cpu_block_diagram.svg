<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 510" width="1010" height="510" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>RV32I single-cycle core block diagram</title>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#37474f"/></marker></defs>
<rect width="1010" height="510" fill="#ffffff"/>
<text x="500" y="30" font-size="18" fill="#0d1b2a" text-anchor="middle" font-weight="700">RV32I single-cycle core (t1_riscv_cpu) - top-level block diagram</text>
<rect x="330" y="52" width="340" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/><text x="500.0" y="84.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">Controller</text><text x="500.0" y="102.0" text-anchor="middle" font-size="11.5" fill="#455a64">main_decoder + alu_decoder + branch compare</text>
<rect x="30" y="190" width="110" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="85.0" y="217.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">PC</text><text x="85.0" y="235.0" text-anchor="middle" font-size="11.5" fill="#455a64">reset_ff</text>
<rect x="190" y="190" width="120" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="250.0" y="217.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">instr_mem</text><text x="250.0" y="235.0" text-anchor="middle" font-size="11.5" fill="#455a64">512 x 32, async read</text>
<rect x="360" y="190" width="120" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="420.0" y="217.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">reg_file</text><text x="420.0" y="235.0" text-anchor="middle" font-size="11.5" fill="#455a64">32 x 32, x0 = 0</text>
<rect x="360" y="300" width="120" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="420.0" y="322.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">imm_extend</text><text x="420.0" y="340.0" text-anchor="middle" font-size="11.5" fill="#455a64">I / S / B / J / U</text>
<rect x="530" y="176" width="60" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="560.0" y="201.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0d1b2a">mux A</text>
<rect x="530" y="236" width="60" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="560.0" y="261.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0d1b2a">mux B</text>
<rect x="630" y="190" width="100" height="76" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/><text x="680.0" y="225.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">ALU</text><text x="680.0" y="243.0" text-anchor="middle" font-size="11.5" fill="#455a64">10 ops, 4-bit ctrl</text>
<rect x="770" y="190" width="140" height="60" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.6"/><text x="840.0" y="217.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">data_mem</text><text x="840.0" y="235.0" text-anchor="middle" font-size="11.5" fill="#455a64">64 x 32 + B/H/W align</text>
<rect x="940" y="190" width="50" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="965.0" y="225.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0d1b2a">mux</text>
<rect x="30" y="400" width="330" height="56" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/><text x="195.0" y="425.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">Next-PC logic</text><text x="195.0" y="443.0" text-anchor="middle" font-size="11.5" fill="#455a64">PC+4  |  PC+imm (branch, JAL)  |  rs1+imm (JALR)</text>
<path d="M140,220 L190,220" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="165" y="212" font-size="11.5" fill="#455a64" text-anchor="middle">PC</text>
<path d="M310,220 L360,220" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="335" y="212" font-size="11.5" fill="#455a64" text-anchor="middle">Instr</text>
<path d="M250,190 L250,87 L330,87" fill="none" stroke="#e65100" stroke-width="1.6" marker-end="url(#a)"/><text x="290" y="80" font-size="11.5" fill="#455a64" text-anchor="middle">Instr</text>
<path d="M250,250 L250,325 L360,325" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="295" y="318" font-size="11.5" fill="#455a64" text-anchor="middle">Instr[31:7]</text>
<path d="M480,205 L530,196" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="505" y="190" font-size="11.5" fill="#455a64" text-anchor="middle">rs1</text>
<path d="M480,235 L530,256" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="507" y="262" font-size="11.5" fill="#455a64" text-anchor="middle">rs2</text>
<path d="M480,325 L510,325 L510,266 L530,266" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="497" y="318" font-size="11.5" fill="#455a64" text-anchor="middle">imm</text>
<path d="M590,196 L630,208" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M590,256 L630,248" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M730,220 L770,220" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="750" y="212" font-size="11.5" fill="#455a64" text-anchor="middle">addr</text>
<path d="M910,220 L940,220" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="925" y="212" font-size="11.5" fill="#455a64" text-anchor="middle">read</text>
<path d="M680,266 L680,380 L965,380 L965,250" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="830" y="374" font-size="11.5" fill="#455a64" text-anchor="middle">ALU result  |  PC+4  (to result mux)</text>
<path d="M965,190 L965,150 L420,150 L420,190" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="720" y="143" font-size="11.5" fill="#455a64" text-anchor="middle">Result  -> rd (write-back)</text>
<path d="M420,350 L420,428 L360,428" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5,4"/><text x="435" y="445" font-size="11.5" fill="#455a64" text-anchor="middle">imm / rs1</text>
<path d="M85,400 L85,250" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="60" y="330" font-size="11.5" fill="#455a64" text-anchor="middle">next PC</text>
<text x="500" y="495" font-size="11.5" fill="#78909c" text-anchor="middle" font-weight="400">Control signals (ResultSrc, MemWrite, PCSrc, ALUSrc, ALUSrcA_PC, ImmSrc, ALUControl, RegWrite, Jump, Jalr) are driven by the controller to the blocks (not drawn).</text>
</svg>