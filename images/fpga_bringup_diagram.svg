<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Basys 3 bring-up block diagram</title>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#37474f"/></marker></defs>
<rect width="960" height="440" fill="#ffffff"/>
<text x="490" y="30" font-size="18" fill="#0d1b2a" text-anchor="middle" font-weight="700">Basys 3 bring-up - single-step clocking and ILA debug (riscv_fpga_top)</text>
<rect x="20" y="90" width="110" height="56" rx="6" fill="#fffde7" stroke="#f9a825" stroke-width="1.6"/><text x="75.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">BTNU</text><text x="75.0" y="133.0" text-anchor="middle" font-size="11.5" fill="#455a64">step button</text>
<rect x="165" y="90" width="120" height="56" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/><text x="225.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">2-FF sync</text><text x="225.0" y="133.0" text-anchor="middle" font-size="11.5" fill="#455a64">metastability</text>
<rect x="320" y="90" width="130" height="56" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/><text x="385.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">Debounce</text><text x="385.0" y="133.0" text-anchor="middle" font-size="11.5" fill="#455a64">~10 ms @ 100 MHz</text>
<rect x="485" y="90" width="120" height="56" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/><text x="545.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">Edge detect</text><text x="545.0" y="133.0" text-anchor="middle" font-size="11.5" fill="#455a64">1 pulse / press</text>
<rect x="640" y="90" width="80" height="56" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/><text x="680.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">BUFG</text><text x="680.0" y="133.0" text-anchor="middle" font-size="11.5" fill="#455a64">cpu_clk</text>
<rect x="760" y="70" width="170" height="96" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><text x="845.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">t1_riscv_cpu</text><text x="845.0" y="133.0" text-anchor="middle" font-size="11.5" fill="#455a64">1 instruction per press</text>
<rect x="790" y="230" width="110" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/><text x="845.0" y="252.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">LED[7:0]</text><text x="845.0" y="270.0" text-anchor="middle" font-size="11.5" fill="#455a64">= PC[9:2]</text>
<rect x="20" y="230" width="110" height="56" rx="6" fill="#fffde7" stroke="#f9a825" stroke-width="1.6"/><text x="75.0" y="255.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">clk</text><text x="75.0" y="273.0" text-anchor="middle" font-size="11.5" fill="#455a64">100 MHz (W5)</text>
<rect x="350" y="215" width="300" height="84" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.6"/><text x="495.0" y="254.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">ILA (ila_0)</text><text x="495.0" y="272.0" text-anchor="middle" font-size="11.5" fill="#455a64">probes: PC, Instr, Result, MemWrite, DataAdr</text>
<rect x="20" y="330" width="110" height="50" rx="6" fill="#fffde7" stroke="#f9a825" stroke-width="1.6"/><text x="75.0" y="352.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0d1b2a">BTNC</text><text x="75.0" y="370.0" text-anchor="middle" font-size="11.5" fill="#455a64">reset</text>
<path d="M130,118 L165,118" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M285,118 L320,118" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M450,118 L485,118" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M605,118 L640,118" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M720,118 L760,118" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M75,230 L75,190 L225,190 L225,146" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M130,258 L350,258" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="255" y="250" font-size="11.5" fill="#455a64" text-anchor="middle">sampled at 100 MHz</text>
<text x="490" y="420" font-size="11.5" fill="#78909c" text-anchor="middle" font-weight="400">The CPU is stepped by exactly one clock edge per button press, so ILA capture depth, CPU clock rate and human reaction time never race each other.</text>
<path d="M845,166 L845,230" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="862" y="203" font-size="11.5" fill="#455a64">PC</text>
<path d="M775,166 L775,262 L650,262" fill="none" stroke="#37474f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#a)"/><text x="705" y="232" font-size="11.5" fill="#455a64" text-anchor="middle">PC / Instr / Result / MemWrite / DataAdr</text>
<path d="M130,355 L952,355 L952,118 L930,118" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#a)"/><text x="480" y="347" font-size="11.5" fill="#455a64" text-anchor="middle">reset</text>
</svg>